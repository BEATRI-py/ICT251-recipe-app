<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Recipe Card App</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>

<body>
    <div class="container">

        <header>
            <h1>My Personal Recipe Card</h1>
            <p>Add, view, edit and delete your favourite recipes.</p>
        </header>

        <section class="card">
            <h2 id="form-title">Add a New Recipe</h2>

            <form id="recipe-form">
                <div class="form-grid">

                    <div class="field">
                        <label for="title">Recipe Title *</label>
                        <input
                            type="text"
                            id="title"
                            maxlength="150"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="category">Category *</label>
                        <input
                            type="text"
                            id="category"
                            maxlength="80"
                            placeholder="e.g. Breakfast"
                            required
                        >
                    </div>

                    <div class="field full-width">
                        <label for="description">Description</label>
                        <input
                            type="text"
                            id="description"
                            maxlength="255"
                            placeholder="A short description of the recipe"
                        >
                    </div>

                    <div class="field full-width">
                        <label for="ingredients">Ingredients *</label>
                        <textarea
                            id="ingredients"
                            required
                            placeholder="List the ingredients"
                        ></textarea>
                    </div>

                    <div class="field full-width">
                        <label for="instructions">Instructions *</label>
                        <textarea
                            id="instructions"
                            required
                            placeholder="Explain how to prepare the recipe"
                        ></textarea>
                    </div>

                    <div class="field">
                        <label for="prep_time">
                            Preparation Time (minutes) *
                        </label>
                        <input
                            type="number"
                            id="prep_time"
                            min="0"
                            step="1"
                            value="10"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="cook_time">
                            Cooking Time (minutes) *
                        </label>
                        <input
                            type="number"
                            id="cook_time"
                            min="0"
                            step="1"
                            value="15"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="servings">Servings *</label>
                        <input
                            type="number"
                            id="servings"
                            min="1"
                            step="1"
                            value="2"
                            required
                        >
                    </div>

                </div>

                <div class="actions">
                    <button class="primary" type="submit" id="save-button">
                        Save Recipe
                    </button>

                    <button
                        class="secondary"
                        type="button"
                        id="cancel-button"
                        hidden
                    >
                        Cancel Edit
                    </button>
                </div>

                <p id="message" role="status" aria-live="polite"></p>
            </form>
        </section>

        <section class="card">
            <h2>Saved Recipes</h2>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Description</th>
                            <th>Ingredients</th>
                            <th>Instructions</th>
                            <th>Prep (min)</th>
                            <th>Cook (min)</th>
                            <th>Servings</th>
                            <th>Created</th>
                            <th>Updated</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody id="recipe-list">
                        <tr>
                            <td colspan="12" class="empty-message">
                                Loading recipes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

    </div>

    <script src="app.js" defer></script>
</body>
</html>
